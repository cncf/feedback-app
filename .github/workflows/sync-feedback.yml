name: sync-feedback

on:
  schedule:
    # 5-minute floor per GitHub's documented minimum. Delays are expected
    # under load; the sync is idempotent so a skipped run is harmless.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-feedback
  cancel-in-progress: false

# No state to persist: the mapping is rebuilt from the hub discussions each
# run, so the workflow needs no write access to this repository at all.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # The schedule is live from the moment this lands, but the Apps may not be
      # registered yet. Skip cleanly rather than emitting a failed run every
      # five minutes - a red cron nobody has wired up yet trains people to
      # ignore red crons.
      - name: check configuration
        id: cfg
        env:
          HUB_APP_ID: ${{ vars.HUB_APP_ID }}
          SOURCE_APP_ID: ${{ vars.SOURCE_APP_ID }}
          HUB_KEY: ${{ secrets.HUB_APP_PRIVATE_KEY }}
          SOURCE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -z "$HUB_APP_ID"    ]] && missing+=(vars.HUB_APP_ID)
          [[ -z "$SOURCE_APP_ID" ]] && missing+=(vars.SOURCE_APP_ID)
          [[ -z "$HUB_KEY"       ]] && missing+=(secrets.HUB_APP_PRIVATE_KEY)
          [[ -z "$SOURCE_KEY"    ]] && missing+=(secrets.SOURCE_APP_PRIVATE_KEY)
          if (( ${#missing[@]} )); then
            echo "::notice::sync not configured yet - missing: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.cfg.outputs.ready == 'true'
        with:
          bun-version: latest

      # Split identities (decision 14). Two Apps, two installations, two keys —
      # both custodied here, neither distributed to participating orgs.
      #
      # Hub App: discussions:write, installed on the hub org only.
      - uses: actions/create-github-app-token@v3
        id: hub-token
        if: steps.cfg.outputs.ready == 'true'
        with:
          app-id: ${{ vars.HUB_APP_ID }}
          private-key: ${{ secrets.HUB_APP_PRIVATE_KEY }}
          owner: cncf
          repositories: cncf-feedback

      # Source App: issues:read + issues:write, installed by each participating
      # project on their own org.
      #
      # NOT minted here. An installation token is scoped to a single
      # installation, so there is no one token covering every participating org
      # — create-github-app-token without `owner` scopes to THIS repository.
      # The sync enumerates installations with the App JWT and mints a token
      # per owner, so it needs the key, not a token.
      - name: sync
        if: steps.cfg.outputs.ready == 'true'
        env:
          GH_HUB_TOKEN: ${{ steps.hub-token.outputs.token }}
          SOURCE_APP_ID: ${{ vars.SOURCE_APP_ID }}
          SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
        run: bun run src/sync.mjs


