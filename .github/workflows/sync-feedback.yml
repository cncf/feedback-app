name: sync-feedback

on:
  schedule:
    # 5-minute floor per GitHub's documented minimum. Delays are expected
    # under load; the sync is idempotent so a skipped run is harmless.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-feedback
  cancel-in-progress: false

permissions:
  contents: write # commit the state file

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Split identities (decision 14). Two Apps, two installations, two keys —
      # both custodied here, neither distributed to participating orgs.
      #
      # Hub App: discussions:write, installed on the hub org only.
      - uses: actions/create-github-app-token@v3
        id: hub-token
        with:
          app-id: ${{ vars.HUB_APP_ID }}
          private-key: ${{ secrets.HUB_APP_PRIVATE_KEY }}
          owner: cncf
          repositories: cncf-feedback

      # Source App: issues:read + issues:write, installed by each participating
      # project on their own org. `owner` omitted deliberately — the token is
      # minted across every installation the App has.
      - uses: actions/create-github-app-token@v3
        id: source-token
        with:
          app-id: ${{ vars.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}

      - name: sync
        env:
          GH_HUB_TOKEN: ${{ steps.hub-token.outputs.token }}
          GH_SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: bun run src/sync.mjs

      - name: commit state
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "cncf-feedback[bot]"
            git config user.email "cncf-feedback[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore(state): sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no state change"
          fi
